apiVersion: v1
kind: ServiceAccount
metadata:
  name: clawforce
  namespace: clawforce
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clawforce-pod-manager
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "namespaces"]
    verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clawforce-pod-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clawforce-pod-manager
subjects:
  - kind: ServiceAccount
    name: clawforce
    namespace: clawforce
