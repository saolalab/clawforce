apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawforce
  namespace: clawforce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clawforce
  template:
    metadata:
      labels:
        app: clawforce
    spec:
      serviceAccountName: clawforce
      containers:
        - name: clawforce
          image: ghcr.io/saolalab/clawforce:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ADMIN_RUNTIME_BACKEND
              value: "k8s"
            - name: K8S_NAMESPACE
              value: "clawforce"
            - name: ADMIN_STORAGE_ROOT
              value: "/data"
            - name: ADMIN_PUBLIC_URL
              value: "http://clawforce.clawforce.svc.cluster.local:8080"
            # AGENT_STORAGE_HOST_PATH must match the hostPath below so worker pods
            # can mount agent data from the host filesystem.
            - name: AGENT_STORAGE_HOST_PATH
              value: "/opt/clawforce-data"
            # Override these for production:
            - name: ADMIN_SETUP_USERNAME
              value: "admin"
            - name: ADMIN_SETUP_PASSWORD
              value: "admin"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: data
          hostPath:
            path: /opt/clawforce-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: clawforce
  namespace: clawforce
spec:
  selector:
    app: clawforce
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
